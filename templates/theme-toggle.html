<div class="theme-toggle-wrap">
  <input class="theme-toggle-input" id="theme-toggle" type="checkbox"
    onchange="this.ownerDocument.documentElement.classList.toggle('dark-theme', this.checked); this.ownerDocument.body.classList.toggle('dark-theme', this.checked);">
  <label class="theme-toggle" for="theme-toggle">&#9790; Dark theme</label>
</div>
