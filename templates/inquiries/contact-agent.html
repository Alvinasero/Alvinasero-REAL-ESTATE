{% extends "base.html" %}

{% block title %}EstateLink | Contact Agent{% endblock %}

{% block content %}
<main class="section-pad bg-soft min-vh-100">
  <div class="container">
    <div class="row g-4 justify-content-center">
      <div class="col-lg-5">
        <p class="eyebrow text-primary">Inquiry form</p>
        <h1 class="fw-bold">Contact Agent</h1>
        <p class="section-copy">Send your property inquiry to the assigned agent.</p>
      </div>

      <div class="col-lg-7">
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        {% if success %}
          <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form class="form-panel" action="{% url 'contact_agent' %}" method="post">
          {% csrf_token %}
          <div class="row g-3">
            <div class="col-md-6">
              <label for="id_name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="id_name" name="name" value="{{ form_data.name }}" placeholder="Your name" required>
            </div>
            <div class="col-md-6">
              <label for="id_email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="id_email" name="email" value="{{ form_data.email }}" placeholder="you@example.com" required>
            </div>
            <div class="col-md-6">
              <label for="id_phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="id_phone" name="phone" value="{{ form_data.phone }}" placeholder="+254 700 000 000" required>
            </div>
            <div class="col-md-6">
              <label for="id_property" class="form-label">Property</label>
              <select class="form-select" id="id_property" name="property_id" required>
                <option value="" {% if not selected_property_id %}selected{% endif %} disabled>Select a property</option>
                {% for property in properties %}
                  <option value="{{ property.pk }}" {% if selected_property_id|stringformat:"s" == property.pk|stringformat:"s" %}selected{% endif %}>
                    {{ property.title }}
                  </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label for="id_message" class="form-label">Message</label>
              <textarea class="form-control" id="id_message" name="message" rows="6" placeholder="I would like to schedule a viewing..." required>{{ form_data.message }}</textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-lg w-100">Submit Inquiry</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
